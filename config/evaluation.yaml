# Evaluation Configuration
evaluation:
  # Experiment settings
  experiment:
    name: "puzzle_solving_experiment"
    description: "Comparing baseline, reflective, and debate agents"

  # Data paths
  paths:
    puzzles_dir: "./data/puzzles"
    logs_dir: "./data/logs"
    results_dir: "./data/results"
    memory_dir: "./data/memory"

  # Metrics to track
  metrics:
    - success_rate
    - reasoning_steps
    - self_corrections
    - time_per_puzzle
    - token_usage
    - confidence_score

  # Logging
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "./data/logs/experiment.log"
    console: true

  # Results storage
  results:
    format: "json"
    save_intermediate: true
    intermediate_interval: 10 # Save every N puzzles

  # Comparison settings
  comparison:
    baseline: true
    reflective: true
    debate: true

  # Statistical analysis
  analysis:
    confidence_level: 0.95
    bootstrap_samples: 1000

  # Visualization
  visualization:
    plot_style: "seaborn-v0_8"
    figure_size: [12, 8]
    dpi: 150
    formats: ["png", "pdf"]
