[project]
name = "reflectiveagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy==2.3.5",
    "openai>=2.43.0",
    "pandas>=2.3.3",
    "pip>=26.1.1",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "pyyaml",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "streamlit>=1.52.2",
    "tiktoken>=0.13.0",
    "tqdm>=4.68.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


# [tool.pytest.ini_options]
# testpaths = ["tests"]
# pythonpath = ["."]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require external services)",
    "slow: marks tests as slow running",
]
asyncio_mode = "auto"
